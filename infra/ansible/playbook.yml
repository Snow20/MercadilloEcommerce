---
- name: Configure Kubernetes Node and Deploy Workloads
  hosts: k8s_nodes
  become: true
  tasks:
    - name: Install prerequisite packages
      apt:
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - docker.io
        state: present
        update_cache: yes

    - name: Enable and start Docker service
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Download K3s installation script
      get_url:
        url: https://get.k3s.io
        dest: /tmp/get_k3s.sh
        mode: '0755'

    - name: Install K3s Lightweight Kubernetes
      command: /tmp/get_k3s.sh
      args:
        creates: /usr/local/bin/k3s

    - name: Copy Kubernetes Deployment Manifests
      copy:
        src: "../k8s/"
        dest: "/tmp/k8s-manifests/"

    - name: Deploy Ecommerce Applications to K8s
      command: k3s kubectl apply -f /tmp/k8s-manifests/